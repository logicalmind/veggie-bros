<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veggie Bros.</title>
  <style>
    html,body{margin:0;height:100%;background:#14141f;color-scheme:dark;display:flex;align-items:center;justify-content:center;overflow:hidden}
    /* Never let the browser claim the drag (a pointercancel mid-jump), zoom on a
       double-tap, select a button glyph or offer the long-press menu/callout. */
    html,body,#touch,#touch button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    /* viewport-fit=cover means the bar must inset itself away from the notch, the
       rounded landscape corners and the home indicator. */
    #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:12px 16px;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:none}
    #touch .g{display:flex;gap:12px;pointer-events:auto}
    #touch button{width:56px;height:56px;border-radius:50%;border:2px solid #555;background:rgba(255,255,255,.15);color:#fff;font-size:20px}
    #touch .wide{width:auto;padding:0 16px;border-radius:28px;font-size:13px}
  </style>
  <!-- The browser chrome and the first paint become the letterbox colour (the html rule above),
       so there is no white boot flash and no light-mode band above the canvas. -->
  <meta name="theme-color" content="#14141f">
  <!-- Dark UA appearance: stops Safari/Chrome inverting the touch-bar buttons and painting the
       canvas backdrop white. The meta covers the boot paint, the html rule covers the document. -->
  <meta name="color-scheme" content="dark">
  <!-- Added to the home screen — the standalone layout S-17 measures — the page must run
       full-screen, not as a Safari-chrome tab; black-translucent draws under the status bar. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <canvas id="game" width="256" height="240"></canvas>
  <!-- type="button" so a button can never submit anything; tabindex="-1" keeps the whole
       bar out of the tab order, because a focused button would also take Enter/Space
       activations on top of the game's own key handling (see src/input.js). -->
  <div id="touch">
    <div class="g"><button id="t-left" type="button" tabindex="-1">◀</button><button id="t-right" type="button" tabindex="-1">▶</button></div>
    <div class="g"><button id="t-start" type="button" tabindex="-1" class="wide">START</button><button id="t-pause" type="button" tabindex="-1" class="wide">PAUSE</button></div>
    <div class="g"><button id="t-run" type="button" tabindex="-1">B</button><button id="t-jump" type="button" tabindex="-1">A</button></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
